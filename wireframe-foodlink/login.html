<html>
        <head>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
            <style> * { font-family: 'Pretendard', sans-serif; } </style>
        </head>

        <div id="app" class="relative w-[390px] min-h-[840px] bg-white px-6 pt-20 flex flex-col">
    <div id="header" class="mb-12">
        <h2 class="text-2xl font-bold text-slate-900 mb-2">반가워요!<br/>푸드링크입니다</h2>
        <p class="text-slate-500">이웃과 함께하는 신선한 나눔을 시작해보세요.</p>
    </div>
    <div id="login-buttons" class="space-y-3 mb-10">
        <button id="btn-kakao" class="w-full h-14 bg-[#FEE500] text-slate-900 font-bold rounded-xl flex items-center justify-center gap-3">
            <i class="fa-solid fa-comment"></i> 카카오로 계속하기
        </button>
        <button id="btn-apple" class="w-full h-14 bg-black text-white font-bold rounded-xl flex items-center justify-center gap-3">
            <i class="fa-brands fa-apple text-xl"></i> Apple로 계속하기
        </button>
        <button id="btn-google" class="w-full h-14 border border-slate-200 text-slate-700 font-bold rounded-xl flex items-center justify-center gap-3">
            <i class="fa-brands fa-google"></i> 구글로 계속하기
        </button>
        <button id="btn-email" class="w-full h-14 bg-slate-50 border border-slate-100 text-slate-600 font-bold rounded-xl flex items-center justify-center gap-3">
            <i class="fa-solid fa-envelope"></i> 이메일로 계속하기
        </button>
    </div>
    <div id="terms" class="mt-auto pb-10">
        <div class="flex items-start gap-3 mb-6">
            <div class="w-5 h-5 rounded border border-slate-300 flex items-center justify-center mt-1">
                <i class="fa-solid fa-check text-xs text-slate-300"></i>
            </div>
            <p class="text-sm text-slate-500">이용약관, 개인정보 처리방침, 위치기반 서비스 이용약관에 모두 동의합니다.</p>
        </div>
        <button id="btn-support" class="w-full text-slate-400 text-sm underline">로그인에 문제가 있나요?</button>
    </div>
</div>
</html>
