<html>
        <head>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
            <style> * { font-family: 'Pretendard', sans-serif; } </style>
        </head>

        
<div class="ui-screen">
    <div id="app" class="relative w-[390px] min-h-[840px] bg-[#F5F5F5] flex flex-col font-['Pretendard'] overflow-clip">
    <header id="header" class="sticky top-0 z-50 flex items-center justify-between h-[56px] px-5 bg-[#F5F5F5]">
        <button class="w-10 h-10 flex items-center justify-start text-[#1E623B]">
            <i class="fa-solid fa-chevron-left text-xl"></i>
        </button>
        <h1 class="text-[17px] font-bold text-gray-900">회원가입</h1>
        <div class="w-10"></div>
    </header>

    <main id="form-content" class="flex-1 px-6 pt-8">
        <div id="intro-text" class="mb-10">
            <h2 class="text-2xl font-bold text-gray-900 leading-tight">
                반가워요!<br>
                <span class="text-[#1E623B]">회원정보</span>를 입력해 주세요.
            </h2>
        </div>

        <div id="signup-form" class="space-y-8">
            <div id="field-email" class="space-y-2">
                <label class="text-sm font-semibold text-gray-600 ml-1">이메일 주소</label>
                <div class="relative">
                    <input type="email" placeholder="example@email.com" class="w-full h-[56px] px-4 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E623B] transition-colors">
                </div>
            </div>

            <div id="field-nickname" class="space-y-2">
                <label class="text-sm font-semibold text-gray-600 ml-1">닉네임</label>
                <div class="flex gap-2">
                    <input type="text" placeholder="닉네임을 입력해주세요" class="flex-1 h-[56px] px-4 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E623B] transition-colors">
                    <button class="h-[56px] px-4 bg-[#628E4E] text-white text-sm font-bold rounded-2xl shrink-0 active:opacity-90">
                        중복 확인
                    </button>
                </div>
                <p class="text-xs text-[#628E4E] ml-1">멋진 닉네임이네요!</p>
            </div>

            <div id="field-password" class="space-y-2">
                <label class="text-sm font-semibold text-gray-600 ml-1">비밀번호</label>
                <div class="relative">
                    <input type="password" placeholder="8자 이상 입력해주세요" class="w-full h-[56px] px-4 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E623B] transition-colors">
                    <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div id="field-password-confirm" class="space-y-2">
                <label class="text-sm font-semibold text-gray-600 ml-1">비밀번호 확인</label>
                <div class="relative">
                    <input type="password" placeholder="비밀번호를 한번 더 입력해주세요" class="w-full h-[56px] px-4 bg-white border border-gray-200 rounded-2xl text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-[#1E623B] transition-colors">
                </div>
            </div>
        </div>

        <div id="terms-section" class="mt-10 flex items-center gap-3 px-1">
            <div class="w-6 h-6 rounded-full bg-[#ABB863] flex items-center justify-center text-white text-xs">
                <i class="fa-solid fa-check"></i>
            </div>
            <p class="text-sm text-gray-500">
                <span class="text-gray-900 font-medium">이용약관 및 개인정보 처리방침</span>에 동의합니다.
            </p>
        </div>
    </main>

    <footer id="footer-cta" class="px-6 py-8">
        <button class="w-full h-[60px] bg-[#1E623B] text-white text-lg font-bold rounded-2xl shadow-lg shadow-[#1E623B]/20 active:scale-[0.98] transition-transform">
            가입하기
        </button>
        <div class="mt-6 flex justify-center items-center gap-2">
            <span class="text-sm text-gray-400">이미 계정이 있으신가요?</span>
            <button class="text-sm font-bold text-[#1E623B] underline underline-offset-4">로그인</button>
        </div>
    </footer>

    <div id="decoration-elements" class="absolute -bottom-10 -right-10 w-40 h-40 bg-[#FCE181] rounded-full blur-[80px] opacity-30 pointer-events-none"></div>
    <div id="decoration-elements-2" class="absolute top-40 -left-10 w-32 h-32 bg-[#ABB863] rounded-full blur-[60px] opacity-20 pointer-events-none"></div>
</div>
</div>

</html>
